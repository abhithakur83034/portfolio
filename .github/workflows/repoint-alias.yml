name: Repoint portfolio alias

on:
  push:
    branches: [master]

jobs:
  repoint-alias:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deployment and update alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_cTLb9snNrhp3K5o9n6ingF9koLYB
          TEAM_ID: team_9nK3yAdUGtA9j5pxzQ4MOk40
          ALIAS: abhishek-kumar-sharma-portfolio.vercel.app
        run: |
          set -e
          START_TIME=$(( $(date +%s) * 1000 - 30000 ))
          DEPLOYMENT_ID=""

          for i in $(seq 1 30); do
            RESP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&target=production&limit=1")
            STATE=$(echo "$RESP" | jq -r '.deployments[0].state // empty')
            CREATED=$(echo "$RESP" | jq -r '.deployments[0].createdAt // 0')
            ID=$(echo "$RESP" | jq -r '.deployments[0].uid // empty')
            echo "Attempt $i: state=$STATE created=$CREATED id=$ID"

            if [ "$STATE" = "READY" ] && [ "$CREATED" -ge "$START_TIME" ]; then
              DEPLOYMENT_ID="$ID"
              break
            fi
            sleep 10
          done

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Timed out waiting for a new READY production deployment"
            exit 1
          fi

          echo "Repointing $ALIAS to deployment $DEPLOYMENT_ID"
          curl -sf -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v2/deployments/$DEPLOYMENT_ID/aliases?teamId=$TEAM_ID" \
            -d "{\"alias\": \"$ALIAS\"}"
